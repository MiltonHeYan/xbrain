<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">xrecall: saved today, useful when you build</title><desc id="desc">Illustrative workflow: save authorized X bookmarks, distill purpose and limitations into local resource memory, then ask your Agent to retrieve applicable notes and cite original sources. No automatic background sync or remote memory is shown.</desc><rect width="1200" height="740" fill="#ffffff"/><text x="56" y="62" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111111">xrecall</text><text x="56" y="137" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#111111">Saved today. Useful when you build.</text><text x="56" y="183" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#555555">Your bookmarks, organized for your next task.</text><rect x="56" y="239" width="336" height="352" rx="20" fill="white" stroke="#d9d9d9"/><text x="84" y="283" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#666666">01</text><text x="84" y="330" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">Save</text><rect x="308" y="267" width="52" height="52" rx="12" fill="#000000" stroke="#000000"/><svg x="320" y="279" width="28" height="28" viewBox="0 0 1200 1227" fill="none">
